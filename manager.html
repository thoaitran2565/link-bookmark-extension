<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Smart Bookmarks - Game Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap');

    :root {
      --bg-color: #0d0f1d;
      --card-bg: #181d30;
      --card-hover: #222842;
      --header-bg: #1f263e;
      --primary: #ff3b00;
      --primary-yellow: #ffcc00;
      --primary-cyan: #00f0ff;
      --text-main: #ffffff;
      --text-muted: #8b9bb4;
      --border: #2d3553;
      --border-light: #424e78;
      --success: #00ff88;
      --danger: #ff4d4d;
      --stroke-dark: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 840px;
      margin: 40px auto;
      padding: 0 20px 40px 20px;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    /* Background Đốm Màu Động Cố Định */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .bg-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: floatBlob 10s infinite alternate ease-in-out;
    }

    .blob-1 { top: -50px; left: -50px; background: var(--primary); }
    .blob-2 { bottom: -50px; right: -50px; background: var(--primary-cyan); animation-delay: -5s; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-title-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .game-badge {
      background: var(--primary-yellow);
      color: #000;
      font-weight: 900;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 2px solid var(--stroke-dark);
      box-shadow: 2px 2px 0px var(--stroke-dark);
      text-transform: uppercase;
    }

    .header-bar h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 30%, var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Thanh tìm kiếm phong cách game */
    .search-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 3px solid var(--stroke-dark);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 24px;
      box-shadow: 4px 4px 0px var(--stroke-dark);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary-cyan);
      box-shadow: 4px 4px 0px var(--stroke-dark), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* Nhóm Domain dạng Thẻ Bài (Card) */
    .domain-group {
      background: var(--card-bg);
      border: 3px solid var(--stroke-dark);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 5px 5px 0px var(--stroke-dark);
      transition: transform 0.2s ease;
    }

    .domain-header {
      padding: 14px 20px;
      background: var(--header-bg);
      font-weight: 800;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-bottom: 3px solid transparent;
      transition: background 0.2s;
    }

    .domain-group.open .domain-header {
      border-bottom-color: var(--stroke-dark);
    }

    .domain-header:hover {
      background: #252e4d;
    }

    .domain-header img {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      vertical-align: middle;
      border-radius: 4px;
    }

    .arrow-icon {
      display: inline-block;
      transition: transform 0.25s ease;
      font-size: 12px;
      margin-right: 8px;
      color: var(--primary-cyan);
    }

    .domain-group.open .arrow-icon {
      transform: rotate(90deg);
    }

    .link-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: none;
    }

    .domain-group.open .link-list {
      display: block;
    }

    /* Từng Item Link */
    .link-item {
      padding: 12px 20px;
      border-top: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px; /* Thêm khoảng cách an toàn giữa tên link và cụm nút */
      font-size: 13px;
      background: var(--card-bg);
      transition: background 0.15s;
    }

    .link-item:hover {
      background: var(--card-hover);
    }

    .link-info {
      flex-grow: 1;
      flex-shrink: 1; /* Cho phép co lại khi không đủ chỗ */
      min-width: 0;   /* Cực kỳ quan trọng để flexbox hiểu cách cắt chữ bằng dấu ... */
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      color: var(--primary-cyan);
      text-decoration: none;
      font-weight: 700;
    }

    .link-info:hover {
      text-decoration: underline;
    }

    /* Vùng chứa các nút hành động (Sửa / Xóa) */
    .link-actions-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0; /* NGAY LẬP TỨC CHẶN ĐỨNG việc bị đẩy xuống dòng */
    }

    /* Nút bấm hành động (Sửa / Xóa / Đổi Domain) */
    .action-btn {
      background: #111625;
      border: 2px solid var(--stroke-dark);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 8px;
      box-shadow: 2px 2px 0px var(--stroke-dark);
      transition: all 0.1s ease;
      font-weight: 700;
    }

    .action-btn:hover {
      background: var(--primary-yellow);
      color: #000;
      transform: translateY(-1px);
      box-shadow: 3px 3px 0px var(--stroke-dark);
    }

    .action-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0px var(--stroke-dark);
    }

    .action-btn.delete:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Modal Phong Cách Hoạt Hình */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: var(--card-bg);
      border: 3px solid var(--stroke-dark);
      padding: 24px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 6px 6px 0px var(--stroke-dark), 0 0 25px rgba(0, 240, 255, 0.2);
      animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-content h4 {
      margin-top: 0;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .modal-content input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-color);
      border: 2px solid var(--border-light);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-weight: 600;
      outline: none;
    }

    .modal-content input[type="text"]:focus {
      border-color: var(--primary-cyan);
    }

    /* Nút bấm trong Modal chuẩn Game */
    .btn-game {
      padding: 10px 16px;
      background: linear-gradient(180deg, #ff5500 0%, var(--primary) 100%);
      color: #fff;
      border: 2px solid var(--stroke-dark);
      border-radius: 10px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--stroke-dark);
      transition: all 0.1s ease;
    }

    .btn-game:hover {
      transform: translateY(-1px);
      box-shadow: 4px 4px 0px var(--stroke-dark);
    }

    .btn-game:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0px var(--stroke-dark);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #374166 0%, #252e4a 100%);
      box-shadow: 3px 3px 0px var(--stroke-dark);
    }

    /* Toast thông báo */
    .toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 3px solid var(--success);
      color: var(--success);
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px var(--stroke-dark);
      z-index: 100;
      animation: bounceIn 0.3s ease;
    }

    @keyframes bounceIn {
      0% { transform: translate(-50%, 20px) scale(0.9); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    .icon-svg {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Background động -->
  <div class="bg-container">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
  </div>

  <div class="header-bar">
    <div class="header-title-wrapper">
      <h2>⚡ Quản lý Smart Bookmarks</h2>
      <span class="game-badge" id="total-count">0 Links</span>
    </div>
  </div>

  <input type="text" id="search-input" class="search-input" placeholder="🔍 Tìm kiếm tên tiêu đề, link hoặc domain...">

  <div id="bookmark-container">
    <!-- Render tự động -->
  </div>

  <!-- Modal Sửa Link -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h4>Chỉnh sửa Bookmark</h4>
      <div class="input-group">
        <label>Tiêu đề:</label>
        <input type="text" id="edit-title">
      </div>
      <div class="input-group">
        <label>URL:</label>
        <input type="text" id="edit-url">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button id="btn-cancel" class="btn-game btn-secondary">Hủy</button>
        <button id="btn-update" class="btn-game">Cập nhật</button>
      </div>
    </div>
  </div>

  <!-- Modal Đổi Domain Cả Nhóm -->
  <div id="domain-modal" class="modal">
    <div class="modal-content">
      <h4>Đổi Domain Nhóm</h4>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: -4px; margin-bottom: 14px;">
        Thao tác này sẽ tự động cập nhật domain và URL cho tất cả link bên trong nhóm.
      </p>
      <div class="input-group">
        <label>Domain mới:</label>
        <input type="text" id="edit-domain-input">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button id="btn-cancel-domain" class="btn-game btn-secondary">Hủy</button>
        <button id="btn-update-domain" class="btn-game">Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">⚡ THÀNH CÔNG!</div>

  <script src="manager.js"></script>
</body>
</html>
